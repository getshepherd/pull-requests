<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pull requests</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/_paddock/paddock.css">
  <style>
    main { max-width: 1100px; }
    /* t3code's icons, Lucide's: strokes in the text's color */
    .lc { flex: none; width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    button.icon > .lc, .bar .lc { width: 16px; height: 16px; }
    h1 { margin: 0 0 16px; font-size: 15px; font-weight: 500; }
    /* the search and the filters stay at the top as the list scrolls under them */
    .bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; align-items: center; margin: 0 -12px 8px; padding: 10px 12px; background: var(--shell); border-bottom: 1px solid transparent; }
    .bar.stuck { border-bottom-color: var(--border); }
    .search { flex: 1; position: relative; min-width: 0; }
    .search > .lc { position: absolute; left: 10px; top: 50%; translate: 0 -50%; color: var(--text-muted); }
    .search input { width: 100%; padding-left: 32px; }
    .bar > button { flex: none; }
    /* busy, the spinner takes the icon's place instead of widening the button beside it */
    #refresh[aria-busy="true"] > .lc { display: none; }
    .count { min-width: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-size: 10px; line-height: 16px; text-align: center; }
    menu[popover] > button.on::after { content: "✓"; margin-left: auto; padding-left: 16px; color: var(--text-muted); }

    /* Filters: Zeron's menu card, its rows opening a second card beside it, as t3code's do */
    .card { position: fixed; inset: auto; margin: 0; padding: 4px; min-width: 240px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text); box-shadow: var(--shadow); }
    .card:popover-open { animation: p-menu-in 0.14s cubic-bezier(0.22, 1, 0.36, 1); }
    .card hr { border: 0; border-top: 1px solid var(--border); margin: 4px 6px; }
    .card .item { display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; padding: 0 8px; border: 0; border-radius: 6px; background: none; color: var(--text); font: inherit; text-align: left; cursor: default; }
    .card .item:hover, .card .item:focus-visible, .card .item.open { background: var(--hover); outline: none; }
    .card .item > .lc { color: var(--text-muted); }
    .card .item .value { margin-left: auto; color: var(--text-muted); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .item.on::after { content: "✓"; padding-left: 12px; color: var(--text-muted); }
    .card .item input[type=checkbox] { margin: 0; }
    #sub { width: 280px; max-height: min(70vh, 560px); overflow: auto; }
    #sub .find { position: sticky; top: -4px; margin: -4px -4px 4px; padding: 8px 8px 6px; background: var(--card); border-bottom: 1px solid var(--border); }
    #sub .find input { width: 100%; height: 26px; border: 0; background: none; box-shadow: none; padding: 0 4px; }
    #sub .avatar { width: 18px; height: 18px; }

    .group { display: flex; align-items: center; gap: 8px; margin: 18px 0 4px; padding: 0 12px; color: var(--text-muted); }
    .group::after { content: ""; flex: 1; border-top: 1px solid var(--border); }
    .group b { font-weight: 500; }
    .group span { color: var(--text-faint); }
    ul.prs { margin: 0; }
    ul.prs > li { padding: 0; border: 0; border-radius: 8px; min-height: 0; }
    ul.prs > li:hover { background: var(--hover); }
    .pr { display: flex; gap: 10px; align-items: flex-start; flex: 1; min-width: 0; padding: 9px 12px; color: inherit; text-decoration: none; border-radius: 8px; }
    /* each state its own Lucide glyph, as t3code's; a conflict lays a red triangle over its corner */
    .glyph { position: relative; flex: none; margin-top: 2px; line-height: 0; }
    .glyph .lc { width: 16px; height: 16px; }
    .glyph .conflict { position: absolute; right: -5px; bottom: -5px; width: 12px; height: 12px; color: var(--danger); fill: var(--shell); stroke-width: 2.5; }
    .open .glyph { color: var(--success); }
    .draft .glyph { color: var(--text-faint); }
    /* t3code's violet-600 and violet-300/90: GitHub's merged purple, not the theme's accent */
    .merged .glyph { color: light-dark(#7c3aed, rgb(196 181 253 / 0.9)); }
    .closed .glyph { color: var(--danger); }
    .more { display: flex; justify-content: center; margin: 24px 0 8px; }
    .lines { flex: 1; min-width: 0; }
    .l1, .l2 { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; }
    .l1 .num { color: var(--text-muted); font-family: var(--mono); font-size: 12px; }
    .l1 .title { overflow: hidden; text-overflow: ellipsis; }
    .l1 .lc { width: 14px; height: 14px; }
    .passing, .approved { color: var(--success); }
    .failing, .changes-requested { color: var(--danger); }
    .pending { color: var(--warning); }
    .l2 { margin-top: 2px; font-size: 12px; color: var(--text-muted); overflow: hidden; }
    .l2 svg { width: 12px; height: 12px; flex: none; fill: currentColor; }
    .l2 .github { color: var(--text); }
    .l2 .gitlab { color: #e24329; }
    .avatar { display: inline-grid; place-items: center; flex: none; width: 16px; height: 16px; border-radius: 50%; background: var(--hover); color: var(--text-muted); font-size: 10px; font-weight: 600; object-fit: cover; }
    .chip { padding: 0 6px; border-radius: 5px; background: var(--hover); color: var(--text); font-size: 11px; line-height: 18px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
    .side { flex: none; text-align: right; font-size: 12px; line-height: 1.6; }
    .side .add { color: var(--success); font-family: var(--mono); }
    .side .del { color: var(--danger); font-family: var(--mono); }
    .side .age { display: block; color: var(--text-muted); }
    /* t3code's speed actions: held Shift shows them on every open row */
    .actions { display: none; gap: 6px; align-items: center; padding-right: 12px; }
    body.shift li.can-act .actions { display: flex; }
    .actions button { height: 26px; }
    .actions .close { color: var(--danger); }
    .actions button[data-confirm] { background: var(--danger); color: var(--on-color); border-color: transparent; }
    .actions .merge[data-confirm] { background: var(--success); }
    .errors { margin: 8px 0; font-size: 12px; color: var(--warning); }
    .errors summary { cursor: pointer; }
    .errors code { color: var(--text-muted); }
    .empty { margin: 48px 0; text-align: center; color: var(--text-muted); }
    .loading { display: grid; place-items: center; margin: 64px 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>Pull requests</h1>
  <div class="bar">
    <label class="search"><i data-i="search"></i>
      <input id="q" type="search" placeholder="Search pull requests, or label:bug author:me repo:mono is:draft" autocomplete="off" aria-label="Search">
    </label>
    <button class="secondary" popovertarget="sorts"><i data-i="arrow-down-up"></i> Sort</button>
    <button class="secondary" popovertarget="filters" id="filters-button"><i data-i="list-filter"></i> Filters <span class="count" id="filter-count" hidden></span></button>
    <button class="secondary icon" id="refresh" title="Refresh"><i data-i="refresh-cw"></i></button>
  </div>
  <menu id="sorts" popover></menu>
  <!-- the submenu lives inside the card, so opening it keeps the card open (a nested popover) -->
  <div id="filters" class="card" popover><div id="rows"></div><div id="sub" class="card" popover></div></div>

  <details class="errors" id="errors" hidden><summary></summary><ul></ul></details>
  <div class="loading" id="loading"><p-spinner></p-spinner></div>
  <div id="list"></div>
  <p class="empty" id="empty" hidden></p>
  <div class="more" id="more" hidden><button class="secondary">Load more pull requests</button></div>
</main>
<script type="module">
  import { call, on, toast } from '/_paddock/paddock.js';

  const $ = (s) => document.querySelector(s);
  const LOGOS = {
    github: 'M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.910 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12',
    gitlab: 'm23.6004 9.5927-.0337-.0862L20.3.9814a.851.851 0 0 0-.3362-.405.8748.8748 0 0 0-.9997.0539.8748.8748 0 0 0-.29.4399l-2.2055 6.748H7.5375l-2.2057-6.748a.8573.8573 0 0 0-.29-.4412.8748.8748 0 0 0-.9997-.0537.8585.8585 0 0 0-.3362.4049L.4332 9.5015l-.0325.0862a6.0657 6.0657 0 0 0 2.0119 7.0105l.0113.0087.03.0213 4.976 3.7264 2.462 1.8633 1.4995 1.1321a1.0085 1.0085 0 0 0 1.2197 0l1.4995-1.1321 2.4619-1.8633 5.006-3.7489.0125-.01a6.0682 6.0682 0 0 0 2.0094-7.003z',
  };
  const SORTS = { updated: 'Recently updated', stale: 'Least recently updated', newest: 'Newest', largest: 'Largest', smallest: 'Smallest' };
  const SORT_ICONS = { updated: 'clock', stale: 'calendar-arrow-up', newest: 'calendar-arrow-down', largest: 'maximize-2', smallest: 'minimize-2' };
  // The filters, t3code's: each one's choices as a label and an icon, and the choice that means no filter.
  const CHOICES = {
    state: [{ open: ['Open', 'git-pull-request-arrow'], merged: ['Merged', 'git-merge'], closed: ['Closed', 'git-pull-request-closed'], all: ['All', 'layers'] }, 'open'],
    involvement: [{ all: ['All', 'layers'], reviewing: ['Reviewing', 'eye'], authored: ['Authored', 'pen-line'] }, 'all'],
    draft: [{ all: ['All', 'layers'], only: ['Drafts only', 'git-pull-request-draft'], hide: ['Hide drafts', 'eye-off'] }, 'all'],
    review: [{ all: ['All', 'layers'], approved: ['Approved', 'circle-check'], 'changes-requested': ['Changes requested', 'circle-x'], 'review-required': ['Review required', 'circle-dashed'], none: ['No reviews', 'circle-slash'] }, 'all'],
    checks: [{ all: ['All', 'layers'], passing: ['Passing', 'circle-check'], failing: ['Failing', 'circle-x'], pending: ['Pending', 'circle-dot'] }, 'all'],
  };
  const GROUPS = [
    ['authored', 'Authored', 'pen-line'],
    ['reviewing', 'Reviewing', 'eye'],
    ['others', 'Others', 'users'],
  ];

  // The picks are this viewer's own, kept across opens; storage may be refused, and the defaults do then.
  const prefs = (() => { try { return JSON.parse(localStorage.getItem('prefs')) ?? {}; } catch { return {}; } })();
  const pick = { sort: 'updated', state: 'open', involvement: 'all', draft: 'all', review: 'all', checks: 'all', author: '', labels: [], host: '', project: '', ...prefs };
  const keep = () => { try { localStorage.setItem('prefs', JSON.stringify(pick)); } catch {} };
  // a pick an older page kept that this one no longer has goes back to its default
  for (const [key, [options, none]] of Object.entries(CHOICES)) if (!(pick[key] in options)) pick[key] = none;
  if (!(pick.sort in SORTS)) pick.sort = 'updated';
  if (!Array.isArray(pick.labels)) pick.labels = [];

  let listing = null;
  // a repository's rows read: 30 at first, each Load more 30 more; a new state starts at 30 again
  let limit = 30;

  async function load(refresh = false) {
    $('#refresh').setAttribute('aria-busy', 'true');
    try {
      listing = await call('list', { state: pick.state, limit, refresh });
      render();
    } catch (e) {
      toast(e.message, { kind: 'error' });
    } finally {
      $('#refresh').removeAttribute('aria-busy');
      $('#loading').hidden = true;
    }
  }

  // label:x author:x repo:x is:draft|approved|mine; the rest is matched against the number, title, repo, branch and
  // author, as t3code's list does.
  function matcher(q) {
    const tests = [];
    const text = [];
    for (const word of q.trim().toLowerCase().split(/\s+/).filter(Boolean)) {
      const [key, value] = word.includes(':') ? [word.slice(0, word.indexOf(':')), word.slice(word.indexOf(':') + 1)] : [];
      if (key === 'label' && value) tests.push((p) => p.labels.some((l) => l.name.toLowerCase().includes(value)));
      else if (key === 'author' && value) tests.push((p) => value === 'me' ? p.mine : `${p.author} ${p.authorName ?? ''}`.toLowerCase().includes(value));
      else if (key === 'repo' && value) tests.push((p) => p.repo.toLowerCase().includes(value));
      else if (key === 'is' && value) tests.push((p) => value === 'draft' ? p.draft : value === 'approved' ? p.approved : value === 'mine' ? p.mine : p.state === value);
      else text.push(word);
    }
    const t = text.join(' ');
    if (t) tests.push((p) => `#${p.number} ${p.title} ${p.repo} ${p.branch} ${p.author}`.toLowerCase().includes(t));
    return (p) => tests.every((test) => test(p));
  }

  const repoKey = (p) => `${p.host}/${p.repo}`;
  // the filter picks, all but the search and the involvement, which picks the groups instead
  const passes = (p) =>
    (pick.draft === 'all' || p.draft === (pick.draft === 'only')) &&
    (pick.review === 'all' || p.review === pick.review) &&
    (pick.checks === 'all' || p.checks === pick.checks) &&
    (!pick.author || p.author === pick.author) &&
    (!pick.labels.length || p.labels.some((l) => pick.labels.includes(l.name))) &&
    (!pick.host || p.host === pick.host) &&
    (!pick.project || repoKey(p) === pick.project);

  const SORTERS = {
    updated: (a, b) => b.updated.localeCompare(a.updated),
    stale: (a, b) => a.updated.localeCompare(b.updated),
    newest: (a, b) => b.created.localeCompare(a.created),
    largest: (a, b) => (b.additions + b.deletions) - (a.additions + a.deletions),
    smallest: (a, b) => (a.additions + a.deletions) - (b.additions + b.deletions),
  };

  function ago(iso) {
    const s = (Date.now() - new Date(iso)) / 1000;
    if (s < 3600) return `${Math.max(1, Math.round(s / 60))}m ago`;
    if (s < 86400) return `${Math.round(s / 3600)}h ago`;
    if (s < 86400 * 365) return `${Math.round(s / 86400)}d ago`;
    return `${Math.round(s / 86400 / 365)}y ago`;
  }

  function el(tag, props = {}, ...children) {
    const e = Object.assign(document.createElement(tag), props);
    e.append(...children.filter((c) => c != null && c !== false));
    return e;
  }
  // Lucide's icons (ISC, lucide.dev), the ones t3code's list shows
  const LUCIDE = {

    'calendar-arrow-up': '<path d="m14 18 4-4 4 4"/><path d="M16 2v4"/><path d="M18 22v-8"/><path d="M21 11.343V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9"/><path d="M3 10h18"/><path d="M8 2v4"/>',
    'chevron-right': '<path d="m9 18 6-6-6-6"/>',
    'circle-check': '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
    'circle-dashed': '<path d="M10.1 2.182a10 10 0 0 1 3.8 0"/><path d="M13.9 21.818a10 10 0 0 1-3.8 0"/><path d="M17.609 3.721a10 10 0 0 1 2.69 2.7"/><path d="M2.182 13.9a10 10 0 0 1 0-3.8"/><path d="M20.279 17.609a10 10 0 0 1-2.7 2.69"/><path d="M21.818 10.1a10 10 0 0 1 0 3.8"/><path d="M3.721 6.391a10 10 0 0 1 2.7-2.69"/><path d="M6.391 20.279a10 10 0 0 1-2.69-2.7"/>',

    'eye-off': '<path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/>',

    'user-round-x': '<path d="M2 21a8 8 0 0 1 11.873-7"/><circle cx="10" cy="8" r="5"/><path d="m17 17 5 5"/><path d="m22 17-5 5"/>',
    'user-round': '<circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>',
    'users': '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  };
  function icon(name, className = '', title = '') {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('class', `lc ${className}`.trim());
    svg.setAttribute('aria-hidden', title ? 'false' : 'true');
    svg.innerHTML = (title ? `<title>${title}</title>` : '') + LUCIDE[name];
    return svg;
  }
  document.querySelectorAll('i[data-i]').forEach((i) => i.replaceWith(icon(i.dataset.i)));

  function logo(provider) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('class', provider);
    svg.setAttribute('aria-label', provider === 'github' ? 'GitHub' : 'GitLab');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', LOGOS[provider]);
    svg.append(path);
    return svg;
  }

  // An avatar, or the login's first letter when it can't load (a private GitLab's need its login).
  function avatar(login, src) {
    const letter = () => el('span', { className: 'avatar' }, (login[0] ?? '?').toUpperCase());
    if (!src) return letter();
    const img = el('img', { className: 'avatar', src, alt: '', loading: 'lazy' });
    img.onerror = () => img.replaceWith(letter());
    return img;
  }

  // A row opens its PR in Shepherd's review panel, which reads it from a checkout of the repository by its branch; a
  // repository known by its URL alone has no checkout, so its rows open on the host.
  function link(p, dirs) {
    const dir = dirs.get(repoKey(p));
    if (!dir) return { href: p.url, target: '_blank' };
    return { href: `shepherd://review?${new URLSearchParams({ dir, branch: p.branch, url: p.url })}` };
  }

  const STATE_ICONS = { open: 'git-pull-request-arrow', draft: 'git-pull-request-draft', closed: 'git-pull-request-closed', merged: 'git-merge' };
  const CHECKS = { passing: ['circle-check', 'Checks pass'], failing: ['circle-x', 'Checks fail'], pending: ['circle-dot', 'Checks run'] };
  const REVIEWS = { approved: ['user-check', 'Approved'], 'changes-requested': ['user-round-x', 'Changes requested'] };

  function row(p, dirs) {
    const state = p.state === 'open' && p.draft ? 'draft' : p.state;
    const labels = p.labels.slice(0, 3).map((l) => el('span', { className: 'chip', title: l.name }, l.name));
    if (p.labels.length > 3) labels.push(el('span', {}, `+${p.labels.length - 3}`));
    const checks = CHECKS[p.checks];
    const review = REVIEWS[p.review];
    return el('li', { className: p.state === 'open' ? 'can-act' : '' },
      el('a', { className: `pr ${state}`, ...link(p, dirs), title: `${p.repo} · ${p.branch}` },
        el('span', { className: 'glyph', title: { open: 'Open', draft: 'Draft', merged: 'Merged', closed: 'Closed' }[state] },
          icon(STATE_ICONS[state]),
          p.conflicts && p.state === 'open' && icon('triangle-alert', 'conflict', 'Conflicts with its base'),
        ),
        el('div', { className: 'lines' },
          el('div', { className: 'l1' },
            el('span', { className: 'num' }, `#${p.number}`),
            el('span', { className: 'title' }, p.draft && !/^draft/i.test(p.title) ? `Draft: ${p.title}` : p.title),
            checks && icon(checks[0], p.checks, checks[1]),
            review && icon(review[0], p.review, review[1]),
          ),
          el('div', { className: 'l2' },
            logo(p.provider),
            avatar(p.author, p.avatar),
            el('span', { title: p.authorName ?? '' }, p.author),
            el('span', {}, p.repo),
            ...labels,
          ),
        ),
        el('div', { className: 'side' },
          el('span', { className: 'add' }, `+${p.additions.toLocaleString()}`), ' ',
          el('span', { className: 'del' }, `−${p.deletions.toLocaleString()}`),
          el('span', { className: 'age', title: new Date(p.updated).toLocaleString() }, ago(p.updated)),
        ),
      ),
      p.state === 'open' && el('div', { className: 'actions' },
        speed(p, 'close', 'Close', 'git-pull-request-closed', 'Confirm close'),
        p.draft ? speed(p, 'ready', 'Ready for review', 'git-pull-request-arrow') : speed(p, 'merge', 'Merge', 'git-merge', 'Confirm merge'),
      ),
    );
  }

  // A speed action's button. Close and Merge ask again on the button itself (a second press within three seconds),
  // t3code's inline confirm; Ready for review goes at once.
  function speed(p, action, label, glyph, confirming) {
    const text = el('span', {}, label);
    const button = el('button', { className: `secondary small ${action}`, type: 'button' }, icon(glyph), text);
    let timer;
    button.onclick = async () => {
      if (confirming && !button.dataset.confirm) {
        button.dataset.confirm = '1';
        text.textContent = confirming;
        timer = setTimeout(() => { delete button.dataset.confirm; text.textContent = label; }, 3000);
        return;
      }
      clearTimeout(timer);
      button.setAttribute('aria-busy', 'true');
      try {
        await call(action, { repo: repoKey(p), number: p.number });
        if (action === 'close') p.state = 'closed';
        if (action === 'merge') p.state = 'merged';
        if (action === 'ready') p.draft = false;
        toast(`#${p.number} ${{ close: 'closed', merge: 'merged', ready: 'is ready for review' }[action]}`, { kind: 'success' });
        if (pick.state !== 'all' && p.state !== pick.state) listing.prs = listing.prs.filter((x) => x !== p);
        render();
      } catch (e) {
        toast(e.message, { kind: 'error', timeout: 8000 });
        button.removeAttribute('aria-busy');
        delete button.dataset.confirm;
        text.textContent = label;
      }
    };
    return button;
  }

  // held Shift shows the speed actions; a key released elsewhere (another window) is let go with the focus
  const shift = (on) => document.body.classList.toggle('shift', on);
  addEventListener('keydown', (e) => e.key === 'Shift' && shift(true));
  addEventListener('keyup', (e) => e.key === 'Shift' && shift(false));
  addEventListener('blur', () => shift(false));

  // --- Filters ---------------------------------------------------------------------------------------------------

  let opened = null; // the filter whose submenu shows

  // The filters' rows: a name, the value picked, and the submenu it opens.
  function filterRows() {
    const repos = listing?.repos ?? [];
    const hosts = [...new Set(repos.map((r) => r.host))];
    const value = (key) => CHOICES[key][0][pick[key]][0];
    const rows = [
      ['state', 'State', value('state')],
      ['involvement', 'Involvement', value('involvement')],
      null,
      ['author', 'Author', pick.author || 'Anyone', 'user-round'],
      ['labels', 'Labels', pick.labels.length ? pick.labels.join(', ') : 'Any', 'tag'],
      ['draft', 'Draft', value('draft')],
      ['review', 'Review', value('review')],
      ['checks', 'Checks', value('checks')],
      null,
      ['host', 'Host', pick.host || 'All', 'plug-2'],
      null,
      ['project', 'Project', repos.find((r) => `${r.host}/${r.path}` === pick.project)?.path ?? 'All projects', pick.project ? 'folder-git-2' : 'layers'],
    ];
    if (hosts.length < 2) rows.splice(8, 2); // one host: nothing to pick between
    $('#rows').replaceChildren(...rows.map((r) => {
      if (!r) return el('hr');
      const [key, name, shown, glyph] = r;
      const item = el('button', { className: `item${opened === key ? ' open' : ''}`, type: 'button' },
        icon(glyph ?? CHOICES[key][0][pick[key]][1]), el('span', { className: 'name' }, name), el('span', { className: 'value' }, shown), icon('chevron-right'));
      const open = () => openSub(key, item);
      item.onclick = open;
      item.onmouseenter = open;
      return item;
    }));
  }

  // set(key, value): a pick from a submenu; the state is the listing's own, asked for anew
  function set(key, value, close = true) {
    pick[key] = value;
    keep();
    if (key === 'state') { limit = 30; load(); }
    render();
    if (close) $('#filters').hidePopover();
  }

  function openSub(key, item) {
    if (opened === key && $('#sub').matches(':popover-open')) return;
    opened = key;
    filterRows();
    const sub = $('#sub');
    sub.replaceChildren(...subItems(key));
    if (!sub.matches(':popover-open')) sub.showPopover();
    // beside the card, on its left as t3code's (the Filters button sits at the right), else on its right
    const card = $('#filters').getBoundingClientRect();
    const row = ($('#rows .item.open') ?? item).getBoundingClientRect();
    const s = sub.getBoundingClientRect();
    sub.style.left = (card.left - s.width - 4 >= 8 ? card.left - s.width - 4 : card.right + 4) + 'px';
    sub.style.top = Math.max(8, Math.min(row.top - 4, innerHeight - s.height - 8)) + 'px';
  }

  function subItems(key) {
    const prs = listing?.prs ?? [];
    if (CHOICES[key]) {
      return Object.entries(CHOICES[key][0]).map(([value, [label, glyph]]) =>
        el('button', { className: `item${pick[key] === value ? ' on' : ''}`, type: 'button', onclick: () => set(key, value) }, icon(glyph), el('span', { className: 'name' }, label)));
    }
    if (key === 'host' || key === 'project') {
      const repos = listing?.repos ?? [];
      const options = key === 'host'
        ? [['', 'All'], ...[...new Set(repos.map((r) => r.host))].map((h) => [h, h])]
        : [['', 'All projects'], ...repos.map((r) => [`${r.host}/${r.path}`, r.path])];
      return options.map(([value, label]) =>
        el('button', { className: `item${pick[key] === value ? ' on' : ''}`, type: 'button', onclick: () => set(key, value) },
          icon(!value ? 'layers' : key === 'host' ? 'plug-2' : 'folder-git-2'), el('span', { className: 'name' }, label)));
    }
    // author and labels: a search over who and what the loaded rows have, the most frequent first
    const counts = new Map();
    const avatars = new Map();
    for (const p of prs) {
      for (const name of key === 'author' ? [p.author] : p.labels.map((l) => l.name)) counts.set(name, (counts.get(name) ?? 0) + 1);
      avatars.set(p.author, p.avatar);
    }
    const names = [...counts.keys()].sort((a, b) => counts.get(b) - counts.get(a) || a.localeCompare(b));
    const list = el('div');
    const find = el('input', { type: 'search', placeholder: key === 'author' ? 'Search authors' : 'Search labels', autocomplete: 'off' });
    const fill = () => {
      const q = find.value.trim().toLowerCase();
      const loaded = (n) => el('span', { className: 'value' }, `${counts.get(n)} loaded`);
      list.replaceChildren(
        key === 'author'
          ? el('button', { className: `item${!pick.author ? ' on' : ''}`, type: 'button', onclick: () => set('author', '') }, icon('layers'), el('span', { className: 'name' }, 'Anyone'))
          : el('button', { className: `item${!pick.labels.length ? ' on' : ''}`, type: 'button', onclick: () => set('labels', []) }, icon('layers'), el('span', { className: 'name' }, 'Any')),
        ...names.filter((n) => n.toLowerCase().includes(q)).map((n) => key === 'author'
          ? el('button', { className: `item${pick.author === n ? ' on' : ''}`, type: 'button', onclick: () => set('author', n) }, avatar(n, avatars.get(n)), el('span', { className: 'name' }, n), loaded(n))
          : el('label', { className: 'item' },
              el('input', { type: 'checkbox', checked: pick.labels.includes(n), onchange: (e) => {
                set('labels', e.target.checked ? [...pick.labels, n] : pick.labels.filter((l) => l !== n), false);
              } }),
              el('span', { className: 'name' }, n), loaded(n))),
      );
    };
    find.oninput = fill;
    fill();
    setTimeout(() => find.focus());
    return [el('div', { className: 'find' }, find), list];
  }

  // the card under its button, right edges together; the submenu goes with it
  $('#filters').addEventListener('toggle', (e) => {
    if (e.newState !== 'open') {
      opened = null;
      return;
    }
    filterRows();
    const b = $('#filters-button').getBoundingClientRect();
    const card = $('#filters');
    card.style.left = Math.max(8, b.right - card.getBoundingClientRect().width) + 'px';
    card.style.top = b.bottom + 4 + 'px';
  });
  $('#sub').addEventListener('toggle', (e) => {
    if (e.newState !== 'open') { opened = null; filterRows(); }
  });

  // --- The list --------------------------------------------------------------------------------------------------

  function render() {
    if (!listing) return;
    const repos = listing.repos;
    const dirs = new Map(repos.filter((r) => r.dir).map((r) => [`${r.host}/${r.path}`, r.dir]));
    if (pick.project && !repos.some((r) => `${r.host}/${r.path}` === pick.project)) pick.project = '';

    $('#sorts').replaceChildren(...Object.entries(SORTS).map(([value, label]) =>
      el('button', { className: value === pick.sort ? 'on' : '', onclick: () => { pick.sort = value; keep(); render(); } }, icon(SORT_ICONS[value]), label)));
    const active = ['involvement', 'draft', 'review', 'checks'].filter((k) => pick[k] !== CHOICES[k][1]).length
      + (pick.state !== 'open') + !!pick.author + !!pick.labels.length + !!pick.host + !!pick.project;
    $('#filter-count').hidden = !active;
    $('#filter-count').textContent = active;
    if ($('#filters').matches(':popover-open')) filterRows();

    const matches = matcher($('#q').value);
    const shown = listing.prs.filter(passes).filter(matches).toSorted(SORTERS[pick.sort]);
    const groupOf = (p) => (p.mine ? 'authored' : p.reviewing ? 'reviewing' : 'others');
    const wanted = pick.involvement === 'all' ? GROUPS : GROUPS.filter(([key]) => key === pick.involvement);
    $('#list').replaceChildren(...wanted.flatMap(([key, label, glyph]) => {
      const prs = shown.filter((p) => groupOf(p) === key);
      if (!prs.length) return [];
      return [
        el('div', { className: 'group' }, icon(glyph), el('b', {}, label), el('span', {}, String(prs.length))),
        el('ul', { className: 'prs' }, ...prs.map((p) => row(p, dirs))),
      ];
    }));

    $('#more').hidden = !listing.more;
    const empty = $('#list').childElementCount === 0;
    $('#empty').hidden = !empty;
    $('#empty').textContent = !repos.length
      ? 'No repositories yet: open a terminal in one, or add it with `pull-requests add-repo --repo <folder or URL>`.'
      : listing.prs.length ? 'Nothing matches.' : `No ${pick.state === 'all' ? '' : CHOICES.state[0][pick.state][0].toLowerCase() + ' '}pull requests.`;

    $('#errors').hidden = !listing.errors.length;
    $('#errors summary').textContent = `${listing.errors.length} ${listing.errors.length === 1 ? 'repository' : 'repositories'} couldn't be read`;
    $('#errors ul').replaceChildren(...listing.errors.map((f) => el('li', {}, el('span', {}, f.repo, ' ', el('code', {}, f.error)))));
  }

  // a line under the bar once the list runs under it
  new IntersectionObserver(([e]) => $('.bar').classList.toggle('stuck', !e.isIntersecting)).observe($('h1'));
  $('#q').addEventListener('input', render);
  $('#refresh').onclick = () => load(true);
  on('repos', () => load(true));
  // a close, merge or ready from the CLI or another page
  on('acted', () => load(true));
  // a listing older than a minute is answered from the cache, and the fresh one comes after
  on('listed', (l) => { if (l.state === pick.state && l.limit === limit) { listing = l; render(); } });
  $('#more button').onclick = async () => {
    const button = $('#more button');
    limit += 30;
    button.setAttribute('aria-busy', 'true');
    await load();
    button.removeAttribute('aria-busy');
  };
  // ponytail: asked again every five minutes while seen; webhooks would need a server the hosts can reach
  setInterval(() => document.visibilityState === 'visible' && load(), 5 * 60 * 1000);
  document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && load());
  // Shepherd says which folder its shown pane is in, when the page loads and each time it is shown: the list goes to
  // that project, all of them when the folder isn't a repository's
  const follow = async (state) => {
    if (!state?.dir) return;
    pick.project = await call('repo-of', { dir: state.dir }).catch(() => '');
    keep();
    render();
  };
  addEventListener('shepherd', (e) => follow(e.detail));
  follow(window.shepherd);
  load();
</script>
</body>
</html>
